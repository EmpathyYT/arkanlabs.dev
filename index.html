<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rihla Legal</title>
  <style>
    html {
      color: #1a1a1a;
      color: light-dark(#1a1a1a, #fdfdfd);
      background-color: #fdfdfd;
      background-color: light-dark(#fdfdfd, #1a1a1a);
      color-scheme: light dark;
    }
    body {
      margin: 0 auto;
      max-width: 36em;
      padding: 50px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      body { padding: 16px; }
    }
    ul { list-style: none; padding: 0; }
    li { margin: 0.75em 0; }
    a { color: #1a5fb4; color: light-dark(#1a5fb4, #78aeed); }
  </style>
  <script>
    // Optional short links: index.html?page=privacy -> privacy-policy.html
    (function () {
      var routes = {
        privacy: "privacy-policy.html",
        rider: "rider_tos.html",
        driver: "driver_tos.html"
      };
      var page = new URLSearchParams(location.search).get("page");
      if (page && routes[page]) location.replace(routes[page]);
    })();
  </script>
</head>
<body>
  <h1>Rihla Legal</h1>
  <ul>
    <li><a href="privacy-policy.html">Privacy Policy</a></li>
    <li><a href="rider_tos.html">Rider Terms of Service</a></li>
    <li><a href="driver_tos.html">Driver Terms of Service</a></li>
  </ul>
</body>
</html>
